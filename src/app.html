<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		// Set the dark class before first paint so there's no flash of the wrong theme.
		try {
			var saved = localStorage.getItem('dark-mode');
			if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			}
			// Start in the last used theme (colours, and its picture or gradient) until the page
			// has loaded its themes, so a refresh doesn't flash a different background first.
			var page = JSON.parse(localStorage.getItem('theme-page') || 'null');
			if (page && /^#[0-9a-f]{3,8}$/i.test(page.light) && /^#[0-9a-f]{3,8}$/i.test(page.dark)) {
				var root = document.documentElement, set = function (k, v) { root.style.setProperty(k, v); };
				root.classList.add('theme-preload');
				set('--pre-light', page.light);
				set('--pre-dark', page.dark);
				var gradient = /^(repeating-)?(linear|radial|conic)-gradient\([^;{}<>"'\\]*\)$/i.test(page.gradient || '') && !/url\s*\(/i.test(page.gradient);
				if (/^(https?:\/\/|\/(?!\/))/.test(page.image || '')) set('--pre-image', 'url("' + encodeURI(page.image) + '")');
				else if (gradient) set('--pre-image', page.gradient);
				set('--pre-size', page.fit === 'tile' ? 'auto' : page.fit === 'contain' ? 'contain' : 'cover');
				set('--pre-repeat', page.fit === 'tile' ? 'repeat' : 'no-repeat');
				set('--pre-blur', (Math.min(40, Math.max(0, +page.blur || 0))) + 'px');
				set('--pre-dim', String(Math.min(90, Math.max(0, +page.dim || 0)) / 100));
			}
		} catch (e) {}
	</script>
	%sveltekit.head%
</head>

<body class="bg-[#f9f0f5] dark:bg-[#281c21] motion-safe:transition-colors motion-safe:duration-300">
	<div class="min-h-screen flex flex-col">%sveltekit.body%</div>
</body>

</html>
