<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		// Set the dark class before first paint so there's no flash of the wrong theme.
		try {
			var saved = localStorage.getItem('dark-mode');
			if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			}
		} catch (e) {}
	</script>
	%sveltekit.head%
</head>

<body class="bg-[#f9f0f5] dark:bg-[#281c21] motion-safe:transition-colors motion-safe:duration-300">
	<div>%sveltekit.body%</div>
</body>

</html>
